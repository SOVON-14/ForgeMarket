<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Espace artisan - ForgeMarket</title><link rel="stylesheet" href="css/styles.css"><link rel="stylesheet" href="css/responsive.css"><link rel="stylesheet" href="css/dashboard.css"></head><body><div id="app"><nav class="navbar"><div class="container"><div class="nav-brand"><a href="index.html"><h1>ForgeMarket</h1></a></div><ul class="nav-menu"><li><a href="artisans.html">Artisans</a></li><li><a href="messages.html">Messages</a></li><li class="nav-auth"><button onclick="logout()" class="btn btn-primary">Déconnexion</button></li></ul></div></nav><main class="dashboard-page"><div class="container"><div class="welcome-section"><h1>Espace artisan</h1><p id="profileStatus">Chargement de votre profil...</p></div><div class="quick-stats"><div class="stat-card"><div class="stat-info"><h3>Commandes</h3><p class="stat-number" id="ordersCount">0</p></div></div><div class="stat-card"><div class="stat-info"><h3>Note moyenne</h3><p class="stat-number" id="rating">0/5</p></div></div><div class="stat-card"><div class="stat-info"><h3>Avis reçus</h3><p class="stat-number" id="reviews">0</p></div></div></div><div class="dashboard-grid"><section class="dashboard-card"><div class="card-header"><h2>Mes commandes</h2></div><div class="card-body" id="artisanOrders"><p class="text-center">Chargement...</p></div></section><section class="dashboard-card"><div class="card-header"><h2>Mon profil professionnel</h2></div><div class="card-body"><form id="artisanProfileForm"><div class="form-group"><label class="form-label" for="businessName">Nom professionnel</label><input class="form-input" id="businessName" name="businessName" required maxlength="150"></div><div class="form-group"><label class="form-label" for="category">Catégorie</label><select class="form-select" id="category" name="category" required><option value="ferronnerie">Ferronnerie</option><option value="soudure">Soudure</option><option value="construction_metallique">Construction métallique</option><option value="menuiserie_metal">Menuiserie métallique</option></select></div><div class="form-group"><label class="form-label" for="city">Ville</label><select class="form-select" id="city" name="city" required><option value="lome">Lomé</option><option value="sokode">Sokodé</option><option value="kara">Kara</option><option value="atsapie">Atsapié</option><option value="tsevie">Tsévié</option></select></div><div class="form-group"><label class="form-label" for="address">Adresse</label><input class="form-input" id="address" name="address" required maxlength="255"></div><div class="form-group"><label class="form-label" for="yearsExperience">Années d’expérience</label><input class="form-input" type="number" id="yearsExperience" name="yearsExperience" min="0" max="80" required></div><div class="form-group"><label class="form-label" for="bio">Présentation</label><textarea class="form-textarea" id="bio" name="bio" required maxlength="5000"></textarea></div><div class="form-group form-checkbox"><input type="checkbox" id="isAvailable" name="isAvailable"><label for="isAvailable">Disponible pour de nouvelles commandes</label></div><button class="btn btn-primary" type="submit">Enregistrer le profil</button></form></div></section></div></div></main><footer class="footer"><div class="container"><div class="footer-bottom"><p>&copy; 2024 ForgeMarket. Tous droits réservés.</p></div></div></footer></div><script src="js/main.js"></script><script src="js/navigation.js"></script><script src="js/artisan-dashboard.js"></script></body></html>
