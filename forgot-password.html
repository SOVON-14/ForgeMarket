<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mot de passe oublié - ForgeMarket</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body>
    <div id="app">
        <nav class="navbar">
            <div class="container">
                <div class="nav-brand">
                    <a href="index.html"><h1>ForgeMarket</h1></a>
                </div>
                <ul class="nav-menu" id="navMenu">
                    <li><a href="index.html">Accueil</a></li>
                    <li><a href="artisans.html">Artisans</a></li>
                    <li><a href="login.html" class="btn btn-outline">Connexion</a></li>
                </ul>
            </div>
        </nav>

        <main class="auth-page">
            <div class="container">
                <div class="auth-container">
                    <div class="auth-card">
                        <div class="auth-header">
                            <h2>Réinitialiser le mot de passe</h2>
                            <p>Cette fonctionnalité sera connectée à l'API backend.</p>
                        </div>

                        <form class="auth-form" data-ajax="true" action="#" method="POST">
                            <div class="form-group">
                                <label for="email" class="form-label">Email</label>
                                <input type="email" id="email" name="email" class="form-input" required placeholder="votre@email.com">
                            </div>
                            <div class="form-group">
                                <button type="submit" class="btn btn-primary btn-large" style="width: 100%;">Envoyer le lien</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="js/main.js"></script>
    <script src="js/navigation.js"></script>
</body>
</html>
